name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk grip-wecker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: grip-wecker
          path: grip-wecker.apk

      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest grip-wecker.apk \
            --title "Grip-Wecker (neuester Build)" \
            --notes "Build ${{ github.run_number }} aus ${{ github.sha }}" \
            --target ${{ github.sha }}

      # Bei Fehler das Log in den Branch ci-log schreiben (zum Nachlesen ohne Login)
      - name: Log sichern
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "kein Log" > /tmp/build.log
          git checkout --orphan ci-log
          git rm -rf . > /dev/null
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "Build-Log ${{ github.run_number }}"
          git push -f origin ci-log
